name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  # 手动触发：Actions 页面点 Run workflow 即可重新构建（不发布）
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KeyMapper.exe (csc / .NET Framework, same as build.bat)
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:KeyMapper.exe /win32icon:keyboard.ico /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Xml.dll KeyMapper.cs
          if errorlevel 1 exit /b 1
          dir KeyMapper.exe

      - name: Verify executable + smoke test
        shell: powershell
        run: |
          $f = Get-Item KeyMapper.exe
          Write-Host "Built: $($f.Name), $($f.Length) bytes"
          if ($f.Length -lt 10000) { throw "Output looks too small" }
          $p = Start-Process .\KeyMapper.exe -ArgumentList "-min" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw "App exited unexpectedly during smoke test" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyMapper-build
          path: |
            KeyMapper.exe
            keyboard.ico
            KeyMapper.cs
            build.bat
            README.md
            使用说明.md

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyMapper-build
          path: release

      - name: Package ZIP
        shell: bash
        run: |
          cd release
          zip -r "KeyMapper-${{ github.ref_name }}.zip" .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          name: KeyMapper ${{ github.ref_name }}
          body: |
            自动构建产物（tag: ${{ github.ref_name }}）
            - KeyMapper.exe（.NET Framework 绿色版，Win7+ 免运行时）
            - 源码 / 图标 / build.bat / 中文说明
          generate_release_notes: true
